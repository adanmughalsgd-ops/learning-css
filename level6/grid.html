<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
       <style>
   *{
   margin:0;
   padding:0; 
}
.box{
    height:75px;
    width: 75px;
    border:3px solid black;
    margin:5px;
    
}
#heading{text-align: left;}

#container{
       height:300px;
       width: 600px;
       padding:10px;
       margin:20px;
       border:3px solid black;
       background-color: lavender;
  
       display:grid;
       grid-template-columns: 80px 100px;
       grid-template-rows: 50px 100px;
       
       
}
#box1{
    grid-column:1 /2;
    grid-row: 1/2;
    background-color: darkgoldenrod;
}

#box2{
     grid-column:2 /2;
     grid-row: 1/2;
    background-color: darkslategrey;
}

#box3{
     grid-column: 1/2;
     grid-row: 2/2;
    background-color: darkred;
}

#box4{
     grid-column: 2/2;
     grid-row:2 /2;
    background-color: lightcoral;
} 
  

    </style>
</head>
<body>
     <h1 id="heading">grid container</h1>
    <div id="container">
        <div id="box1" class="box">flexitem1</div>
         <div id="box2" class="box">flexitem2</div>
         <div id="box3" class="box">flexitem3</div>
         <div id="box4" class="box">flexitem4</div>
</body>
</html>
