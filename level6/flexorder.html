<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-order</title>
     <style>
   *{
   margin:0;
   padding:0; 
}
.box{
    height:75px;
    width: 750px;
    border:3px solid black;
    margin:5px;
    
}
#heading{text-align: left;}

#container{
       height:300px;
       width: 600px;
       padding:10px;
       margin:20px;
       border:3px solid black;
       background-color: lavender;
  
       display:flex;
       justify-content:center;
       
}
#box1{background-color: darkgoldenrod;
order: 2;}

#box2{background-color: darkslategrey;
order: 4;}

#box3{background-color: darkred;
order: 3;}

#box4{background-color: lightcoral;
order: 1;} 
  

    </style>
</head>
<body>
     <h1 id="heading">flexbox container</h1>
    <div id="container">
        <div id="box1" class="box">flexitem1</div>
         <div id="box2" class="box">flexitem2</div>
         <div id="box3" class="box">flexitem3</div>
         <div id="box4" class="box">flexitem4</div>
</body>
</html>
