<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>min max width combination</title>
    <style>
.box{
    height: 100px;
    width: 100px;
    background-color: darkslategray;
    }
    @media screen and(min-width:250px)and
     (max-width:300px)  {
        .box{
            border-radius: 50px;
        }

    }
        
    
    </style>
</head>
<body>
    <div class="box">box</div>
</body>
</html>
