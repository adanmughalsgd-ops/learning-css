<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>justify contant</title>
    <style>
        *{
   margin:0;
   padding:0; 
}
.box{
    height:75px;
    width: 75px;
    border:3px solid black;
    margin: 5px;
}
#heading{text-align: center;}

#container{
       height:600px;
       width: 600px;
       padding:100px;
       margin:100px;
       border:3px solid black;
       background-color: lavender;
  
       display:flex;
       justify-content:space-between;
}
#box1{background-color: darkgoldenrod;}
#box2{background-color: darkslategrey;}
#box3{background-color: darkred;}
#box4{background-color: lightcoral;} 
  

    </style>
</head>
<body>
     <h1 id="heading">flexbox container</h1>
    <div id="container">
        <div id="box1" class="box">flexitem1</div>
         <div id="box2" class="box">flexitem2</div>
         <div id="box3" class="box">flexitem3</div>
         <div id="box4" class="box">flexitem4</div>

    </div> 
</body>
</html>
