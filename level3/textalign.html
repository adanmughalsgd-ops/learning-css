<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text align</title>
    <style>
        #box{
            height: 100px;
            width: 100px;
            background-color: darkgoldenrod;
            text-align: center;
        }
     .box{
        height: 100px;
        width: 100px;
        background-color: crimson;
        text-align: right;
     }




    </style>
</head>
<body>
    <div id="box">Box</div>
    <div id="box">Box</div>
    <div class="box">box</div>


</body>
</html>
