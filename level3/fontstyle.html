<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font style</title>
    <style>
#article{
    font-style: italic;
}
#paragraph{
    font-style: oblique;
}
#writing{
    font-style: normal;
}
    </style>
</head>
<body>
    <p id="article">Lorem ipsum, dolor sit amet consectetur adipisicing elit.</p>
    <p id="paragraph">Lorem, ipsum dolor sit amet consectetur adipisicing elit.</p>
    <p id="writing">Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
    
</body>
</html>
