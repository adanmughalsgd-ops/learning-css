<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text transform</title>
    <style>
   #box1{
    text-transform: capitalize;
   }
    #box2{
       text-transform: lowercase; 
    }
  #box3{
     text-transform: uppercase;
  }
#box4{
    text-transform: none;
}
   
    </style>
</head>
<body>
    <h3 id="box1">first box<h3>
    <h3 id="box2">second box</h3>
    <h3 id="box3">third box</h3>
    <h3 id="box4">four box</h3> 

</body>
</html>
