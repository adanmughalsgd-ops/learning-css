<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin property</title>
    <style>
        .{
            margin:0;
            padding:0;
        }
        .padded{
    height:50px;
    width:50px;
    padding:2px;
    border:5px;
     }


 #first{
       margin:5px 5px 50px 5px;
    background-color:darkslateblue;
 }
 #second{
       margin:50px 5px 5px 5px;
    background-color:darkorchid;
 }
    </style>
</head>
<body>
    <div id="first" class="padded">first</div>
    <div id="second" class="padded">second</div>

</body>
</html>
