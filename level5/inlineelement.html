<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inline element</title>
    <style>
        *{
            margin:0; padding:0;
        }
     .box{
        margin:50px;
        background-color: darkcyan;
        text-align: center;
        border:6px solid pink;
        border-radius:10px;

        display: inline;

     }
    </style>
</head>
<body>
    <div id="box1" class="box">box1</div>
    <div id="box2" class="box">box2</div>
</body>
</html>
